            font-size: 15px;
            padding: 6px 14px;
            border-radius: 6px;
            transition: background 0.15s;

        .navbar a:hover {
            background: #f0f6ff;
        }
        .navbar a.active {
            background: #0366d6;
            color: #fff;
        }

        }
        .navbar .spacer {

        }
        .navbar .badge {
            font-size: 13px;
            color: #57606a;
        }

        .header .score { font-size: 16px; color: #0550ae; font-weight: 500; }
        .header .score span { font-size: 22px; font-weight: 700; }
        .progress-wrap { background: #e9ecef; border-radius: 10px; height: 8px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { height: 100%; background: #0366d6; border-radius: 10px; transition: width 0.3s ease; width: 0%; }
        .q-type { display: inline-block; font-size: 13px; font-weight: 600; padding: 3px 14px; border-radius: 20px; margin-bottom: 12px; }
        .q-type.单选 { background: #ddf4ff; color: #0550ae; }
        .q-type.多选 { background: #dafbe1; color: #116329; }
        .q-type.判断 { background: #fff8c5; color: #7a5d00; }

        .q-text { font-size: 18px; line-height: 1.7; margin-bottom: 18px; font-weight: 500; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-item {
            padding: 14px 18px;
            border: 2px solid #e1e4e8;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;

        .option-item:hover { border-color: #8b949e; background: #f6f8fa; }
        .option-item .letter { font-weight: 700; color: #57606a; min-width: 24px; }
        .option-item.selected { border-color: #0366d6; background: #f0f6ff; }
        .option-item.selected .letter { color: #0366d6; }
        .option-item.correct { border-color: #1a7f37; background: #dafbe1; }
        .option-item.correct .letter { color: #1a7f37; }
        .option-item.wrong { border-color: #cf222e; background: #ffebe9; }
        .option-item.wrong .letter { color: #cf222e; }
        .option-item.disabled { cursor: not-allowed; opacity: 0.7; }
        .option-item.disabled:hover { border-color: #e1e4e8; background: transparent; }
        .multi-hint { font-size: 14px; color: #57606a; margin-bottom: 12px; }
        .actions { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
        .actions button { padding: 12px 32px; border: none; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.15s; }

        .btn-submit:hover { background: #0255b3; }
        .btn-submit:disabled { background: #8b949e; cursor: not-allowed; }
        .btn-next { background: #e1e4e8; color: #24292e; }
        .btn-next:hover { background: #d0d7de; }
        .btn-restart { background: #e1e4e8; color: #24292e; }
        .btn-restart:hover { background: #d0d7de; }
        .feedback { margin-top: 14px; padding: 12px 18px; border-radius: 10px; font-size: 15px; font-weight: 500; display: none; }

        .feedback.correct { background: #dafbe1; color: #1a7f37; }
        .feedback.wrong { background: #ffebe9; color: #cf222e; }
        .feedback .answer-detail { font-weight: 400; margin-top: 4px; font-size: 14px; }

        .result .big-score .num { font-size: 64px; font-weight: 700; color: #0366d6; }
        .result .big-score .label { font-size: 18px; color: #57606a; }

    </style>
</head>

        <div class="feedback" id="feedback"></div>
        <div class="actions">

            <button class="btn-next" id="btnNext" onclick="nextQuestion()" style="display:none;">下一题 →</button>
        </div>
    </div>

    <div class="result" id="resultArea">
        <div class="big-score">
            <div class="num" id="finalScore">0</div>
            <div class="label">总分（共 <span id="totalCountLabel">100</span> 题）</div>

            <div class="stat-card blue"><div class="num" id="accuracy">0%</div><div class="label">正确率</div></div>
        </div>
        <div class="wrong-list" id="wrongList">

        </div>
        <div class="actions" style="margin-top:20px;">

const TOTAL = examQuestions.length;

let currentIndex = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let userAnswers = [];
let answered = [];
let wrongList = [];
let selectedMulti = [];

// DOM 缓存
const qType = document.getElementById('qType');
const qNumber = document.getElementById('qNumber');
const qText = document.getElementById('qText');
const optionsContainer = document.getElementById('optionsContainer');
const multiHint = document.getElementById('multiHint');
const feedback = document.getElementById('feedback');
const btnSubmit = document.getElementById('btnSubmit');
const btnNext = document.getElementById('btnNext');
const scoreNum = document.getElementById('scoreNum');
const progressText = document.getElementById('progressText');
const progressBar = document.getElementById('progressBar');
const examArea = document.getElementById('examArea');
const resultArea = document.getElementById('resultArea');

// ==================== 获取正确答案索引 ====================
function getCorrectIndex(q) {
    if (q.type === '判断') {
        if (q.answer === '正确') return 0;
        if (q.answer === '错误') return 1;
        if (q.answer === '√') return 0;
        if (q.answer === '×') return 1;
        return null;
    }
    if (q.type === '单选') {
        const map = {'A':0, 'B':1, 'C':2, 'D':3};
        return map[q.answer] !== undefined ? map[q.answer] : null;
    }
    if (q.type === '多选') {
        const map = {'A':0, 'B':1, 'C':2, 'D':3};
        return q.answer.split('').map(ch => map[ch]).filter(i => i !== undefined);
    }
    return null;
}

// ==================== 获取选项文本 ====================
function getOptionText(q, idx) {
    if (q.type === '判断') {
        return idx === 0 ? '正确' : '错误';
    }
    if (q.options && q.options[idx]) {
        return q.options[idx];
    }
    return String(idx);
}

// ==================== 初始化 ====================
function init() {
    document.getElementById('totalCountLabel').textContent = TOTAL;
    currentIndex = 0;
    score = 0;
    correctCount = 0;
    wrongCount = 0;
    userAnswers = new Array(TOTAL).fill(null);
    answered = new Array(TOTAL).fill(false);
    wrongList = [];
    selectedMulti = [];
    examArea.style.display = 'block';
    resultArea.classList.remove('show');
    renderQuestion();
    updateStats();
}

// ==================== 渲染题目 ====================
function renderQuestion() {
    const q = examQuestions[currentIndex];
    if (!q) return;

    qType.textContent = q.type;
    qType.className = 'q-type ' + q.type;
    qNumber.textContent = `第 ${currentIndex + 1} 题（共 ${TOTAL} 题）`;
    qText.textContent = q.question;

    optionsContainer.innerHTML = '';

    if (q.type === '判断') {
        const jOptions = ['正确', '错误'];
        jOptions.forEach((text, idx) => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.dataset.index = idx;
            div.innerHTML = `<span class="letter">${'AB'[idx]}.</span> ${text}`;
            div.onclick = () => handleOptionClick(idx);
            optionsContainer.appendChild(div);
        });
    } else if (q.options && q.options.length > 0) {
        const labels = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, idx) => {
            if (!opt) return;
            const div = document.createElement('div');
            div.className = 'option-item';
            div.dataset.index = idx;
            div.innerHTML = `<span class="letter">${labels[idx]}.</span> ${opt}`;
            div.onclick = () => handleOptionClick(idx);
            optionsContainer.appendChild(div);
        });
    }

    if (q.type === '多选') {
        multiHint.style.display = 'block';
        btnSubmit.style.display = 'inline-block';
        btnSubmit.disabled = false;
        btnSubmit.textContent = '确认答案';
    } else {
        multiHint.style.display = 'none';
        btnSubmit.style.display = 'none';
    }

    feedback.classList.remove('show', 'correct', 'wrong');
    feedback.textContent = '';

    if (answered[currentIndex]) {
        const selected = userAnswers[currentIndex];
        const items = optionsContainer.querySelectorAll('.option-item');
        const qType = examQuestions[currentIndex].type;

        if (qType === '多选') {
            items.forEach((item, idx) => {
                if (selected && selected.includes(idx)) {
                    item.classList.add('selected');
                }
            });
            showFeedbackForCurrent();
        } else {
            items.forEach((item, idx) => {
                if (idx === selected) {
                    item.classList.add('selected');
                    const isCorrect = selected === getCorrectIndex(q);
                    if (isCorrect) {
                        item.classList.add('correct');
                    } else {
                        item.classList.add('wrong');
                        const correctIdx = getCorrectIndex(q);
                        if (correctIdx !== null && items[correctIdx]) {
                            items[correctIdx].classList.add('correct');
                        }
                    }
                }
            });
            showFeedbackForCurrent();
        }
        items.forEach(item => item.classList.add('disabled'));
        if (qType === '多选') {
            btnSubmit.disabled = true;
            btnSubmit.textContent = '已作答';
        }
        btnNext.style.display = 'inline-block';
    } else {
        optionsContainer.querySelectorAll('.option-item').forEach(item => item.classList.remove('disabled'));
        btnNext.style.display = 'none';
        if (q.type === '多选') {
            btnSubmit.disabled = false;
            btnSubmit.textContent = '确认答案';
        }
    }

    updateStats();
}

// ==================== 选项点击 ====================
function handleOptionClick(idx) {
    if (answered[currentIndex]) return;
    const q = examQuestions[currentIndex];

    if (q.type === '多选') {
        const items = optionsContainer.querySelectorAll('.option-item');
        const item = items[idx];
        if (item.classList.contains('selected')) {
            item.classList.remove('selected');
            selectedMulti = selectedMulti.filter(i => i !== idx);
        } else {
            item.classList.add('selected');
            selectedMulti.push(idx);
            selectedMulti.sort();
        }
        return;
    }

    const items = optionsContainer.querySelectorAll('.option-item');
    items.forEach(el => el.classList.remove('selected'));
    items[idx].classList.add('selected');

    const correctIdx = getCorrectIndex(q);
    const isCorrect = (idx === correctIdx);

    userAnswers[currentIndex] = idx;
    answered[currentIndex] = true;
    if (isCorrect) {
        correctCount++;
        score += 1;
    } else {
        wrongCount++;
        wrongList.push({
            index: currentIndex,
            question: q.question,
            type: q.type,
            options: q.options,
            answer: q.answer,
            userAnswer: idx,
            userAnswerText: getOptionText(q, idx)
        });
    }

    items.forEach(el => el.classList.add('disabled'));
    if (isCorrect) {
        items[idx].classList.add('correct');
        showFeedback(true, '✅ 回答正确！');
    } else {
        items[idx].classList.add('wrong');
        if (correctIdx !== null && items[correctIdx]) {
            items[correctIdx].classList.add('correct');
        }
        showFeedback(false, '❌ 回答错误', q);
    }

    btnNext.style.display = 'inline-block';
    if (q.type === '多选') {
        btnSubmit.disabled = true;
        btnSubmit.textContent = '已作答';
    }
    updateStats();
}

// ==================== 多选提交 ====================
function submitAnswer() {
    const q = examQuestions[currentIndex];
    if (q.type !== '多选') return;
    if (answered[currentIndex]) return;
    if (selectedMulti.length === 0) {
        alert('请至少选择一个选项');
        return;
    }

    const items = optionsContainer.querySelectorAll('.option-item');
    const correctIdx = getCorrectIndex(q);
    const isCorrect = selectedMulti.length === correctIdx.length &&
        selectedMulti.every((v, i) => v === correctIdx[i]);

    userAnswers[currentIndex] = [...selectedMulti];
    answered[currentIndex] = true;
    if (isCorrect) {
        correctCount++;
        score += 1;
    } else {
        wrongCount++;
        wrongList.push({
            index: currentIndex,
            question: q.question,
            type: q.type,
            options: q.options,
            answer: q.answer,
            userAnswer: selectedMulti,
            userAnswerText: selectedMulti.map(i => 'ABCD'[i]).join('')
        });
    }

    items.forEach(el => el.classList.add('disabled'));
    if (isCorrect) {
        items.forEach(el => {
            if (el.classList.contains('selected')) el.classList.add('correct');
        });
        showFeedback(true, '✅ 回答正确！');
    } else {
        items.forEach(el => {
            if (el.classList.contains('selected')) el.classList.add('wrong');
        });
        correctIdx.forEach(i => {
            if (items[i]) items[i].classList.add('correct');
        });
        showFeedback(false, '❌ 回答错误', q);
    }

    btnSubmit.disabled = true;
    btnSubmit.textContent = '已作答';
    btnNext.style.display = 'inline-block';
    updateStats();
}

// ==================== 显示反馈 ====================
function showFeedback(isCorrect, message, q) {
    feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
    let detail = '';
    if (!isCorrect && q) {
        let correctText = q.answer;
        if (q.type === '判断') {
            correctText = q.answer === '正确' ? '正确' : '错误';
        }
        detail = `<div class="answer-detail">✅ 正确答案：${correctText}</div>`;
    }
    feedback.innerHTML = message + detail;
}

function showFeedbackForCurrent() {
    const q = examQuestions[currentIndex];
    const selected = userAnswers[currentIndex];
    if (selected === null) return;

    const correctIdx = getCorrectIndex(q);
    let isCorrect;
    if (q.type === '多选') {
        isCorrect = selected.length === correctIdx.length &&
            selected.every((v, i) => v === correctIdx[i]);
    } else {
        isCorrect = (selected === correctIdx);
    }

    const message = isCorrect ? '✅ 回答正确！' : '❌ 回答错误';
    showFeedback(isCorrect, message, isCorrect ? null : q);
}

// ==================== 下一题 ====================
function nextQuestion() {
    if (currentIndex < TOTAL - 1) {
        currentIndex++;
        selectedMulti = [];
        renderQuestion();
        document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
        showResult();
    }
}

// ==================== 更新统计 ====================
function updateStats() {
    scoreNum.textContent = score;
    const done = answered.filter(a => a === true).length;
    progressText.textContent = `${done}/${TOTAL}`;
    const pct = TOTAL > 0 ? (done / TOTAL * 100) : 0;
    progressBar.style.width = pct + '%';
}

// ==================== 成绩单 ====================
function showResult() {
    examArea.style.display = 'none';
    resultArea.classList.add('show');

    document.getElementById('finalScore').textContent = score;
    document.getElementById('correctCount').textContent = correctCount;
    document.getElementById('wrongCount').textContent = wrongCount;
    const acc = TOTAL > 0 ? Math.round((correctCount / TOTAL) * 100) : 0;
    document.getElementById('accuracy').textContent = acc + '%';
    document.getElementById('totalCountLabel').textContent = TOTAL;

    const container = document.getElementById('wrongItems');
    if (wrongList.length === 0) {
        container.innerHTML = '<p style="color:#1a7f37;font-weight:500;">🎉 全部正确，太棒了！</p>';
    } else {
        let html = '';
        wrongList.forEach((w, i) => {
            let userAnsText = w.userAnswerText;
            if (w.type === '判断') {
                userAnsText = w.userAnswer === 0 ? '正确' : '错误';
            } else if (w.type === '多选' && Array.isArray(w.userAnswer)) {
                userAnsText = w.userAnswer.map(idx => 'ABCD'[idx]).join('');
            } else if (w.type === '单选' && typeof w.userAnswer === 'number') {
                userAnsText = 'ABCD'[w.userAnswer] || w.userAnswer;
            }
            html += `
                <div class="wrong-item">
                    <div class="w-q">${i+1}. ${w.question}</div>
                    <div class="w-detail">❌ 你的答案：<span class="wrong-ans">${userAnsText}</span> ｜ ✅ 正确答案：<span class="right-ans">${w.answer}</span></div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
}

// ==================== 重新测试 ====================
function restartExam() {
    location.reload();
}

// ==================== 启动 ====================
