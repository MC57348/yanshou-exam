        if (!Array.isArray(allQuestions) || allQuestions.length === 0) {
            throw new Error('数据加载失败，allQuestions 不是数组或为空。');
        }
        console.log('成功加载 ' + allQuestions.length + ' 道题目');

        const statsEl = document.getElementById('stats');
        const totalSpan = document.getElementById('totalCount');
        const resultsEl = document.getElementById('results');
        const keywordInput = document.getElementById('keyword');
        const typeFilter = document.getElementById('typeFilter');

        if (!statsEl || !totalSpan || !resultsEl || !keywordInput || !typeFilter) {
            throw new Error('DOM 元素缺失，请检查页面结构');
        }

        function renderItems(items) {
            totalSpan.textContent = allQuestions.length;

            if (items.length === 0) {
                resultsEl.innerHTML = '<div class="no-result">😕 没有找到匹配的题目</div>';
                statsEl.innerHTML = `共 ${allQuestions.length} 道题目，未找到匹配项`;
                return;
            }

            let html = '';
            items.forEach((q, index) => {
                const typeClass = `tag-${q.type}`;
                let optionsHtml = '';
                if (q.options && q.options.length > 0) {
                    const labels = ['A', 'B', 'C', 'D'];
                    let has = false;
                    q.options.forEach((opt, idx) => {
                        if (opt) {
                            has = true;
                            optionsHtml += `<span class="opt">${labels[idx]}. ${opt}</span>`;
                        }
                    });
                    if (has) optionsHtml = `<div class="options">${optionsHtml}</div>`;
                    if (q.type === '判断') optionsHtml = '';
                }
                let answerDisplay = q.answer;
                if (q.type === '判断') {
                    answerDisplay = q.answer === '正确' ? '正确' : '错误';
                }
                let sourceHtml = q.source ? `<div class="source">📖 ${q.source}</div>` : '';
                html += `
                    <div class="question-item">
                        <div class="header">
                            <span class="id">#${q.id || index+1}</span>
                            <span class="tag ${typeClass}">${q.type}</span>
                        </div>
                        <div class="q-text">${q.question}</div>
                        ${optionsHtml}
                        <div class="answer">✅ 答案：${answerDisplay}</div>
                        ${sourceHtml}
                    </div>
                `;
            });
            resultsEl.innerHTML = html;
            statsEl.innerHTML = `共 ${allQuestions.length} 道题目，找到 <strong>${items.length}</strong> 条结果`;
        }

        function doSearch() {
            const rawKeyword = keywordInput.value.trim();
            const type = typeFilter.value;

            const words = rawKeyword ? rawKeyword.split(/\s+/).filter(w => w.length > 0) : [];

            if (words.length === 0 && !type) {
                renderItems(allQuestions);
                return;
            }

            const filtered = allQuestions.filter(q => {
                if (type && q.type !== type) return false;
                if (words.length === 0) return true;
                return words.every(word => {
                    const lowerWord = word.toLowerCase();
                    if (q.question.toLowerCase().includes(lowerWord)) return true;
                    if (q.options && q.options.some(opt => opt.toLowerCase().includes(lowerWord))) return true;
                    if (q.answer && q.answer.toLowerCase().includes(lowerWord)) return true;
                    if (q.type === '判断') {
                        const answerText = q.answer === '正确' ? '正确' : '错误';
                        if (answerText.includes(lowerWord)) return true;
                    }
                    return false;
                });
            });
            renderItems(filtered);
        }

        function resetSearch() {
            keywordInput.value = '';
            typeFilter.value = '';
            renderItems(allQuestions);
        }

        window.doSearch = doSearch;
        window.resetSearch = resetSearch;

        renderItems(allQuestions);

    } catch (e) {
        const display = document.getElementById('errorDisplay');
        if (display) {
            display.style.display = 'block';
            display.textContent = '❌ 初始化错误：' + e.message + '\n' + (e.stack || '');
        } else {
            alert('初始化错误：' + e.message);
        }
    }
})();
